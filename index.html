<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#263b56">
<title>ボイメン5人 統合イベントカレンダー</title>
<style>
:root {
  --bg: #f6f4f1;
  --card: #fff;
  --ink: #262626;
  --muted: #777;
  --line: #e8e4df;
  --navy: #263b56;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
}
header {
  background: var(--navy);
  color: #fff;
  padding: 20px max(15px, calc((100% - 1100px)/2));
}
h1 { font-size: clamp(1.2rem, 3vw, 1.7rem); margin: 0 0 5px; }
header p { margin: 0; color: #dbe3ee; font-size: .9rem; }
main {
  max-width: 1100px;
  margin: 18px auto;
  padding: 0 12px 32px;
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(280px, .9fr);
  gap: 14px;
}
.panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 14px;
  min-width: 0;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
button, input, select, textarea { font: inherit; }
button {
  border: 1px solid #d8d4cf;
  background: white;
  border-radius: 9px;
  padding: 8px 11px;
  cursor: pointer;
}
button.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
button.danger { color: #a72e2e; }
.month { font-weight: 750; font-size: 1.2rem; }
.weekdays, .calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}
.weekdays div {
  text-align: center;
  color: var(--muted);
  font-size: .76rem;
  padding: 6px 0;
}
.day {
  min-height: 82px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow: hidden;
}
.day.outside { background: #faf9f7; color: #aaa; }
.day.today { border: 2px solid var(--navy); }
.day.selected { box-shadow: inset 0 0 0 2px #d5a642; }
.daynum { font-size: .85rem; font-weight: 700; }
.pill {
  font-size: .68rem;
  line-height: 1.35;
  border-radius: 4px;
  padding: 3px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 7px 10px;
  font-size: .8rem;
  margin: 12px 0;
}
.legend span { display: flex; align-items: center; gap: 5px; }
.dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  display: inline-block;
  flex: 0 0 13px;
}
.muted { font-size: .82rem; color: var(--muted); line-height: 1.5; }
.status { font-size: .78rem; line-height: 1.5; background: #f4f1eb; padding: 9px; border-radius: 8px; }
.status.ok { background: #eaf6ec; }
.status.warn { background: #fff2dc; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.event { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.event h3 {
  font-size: 1rem;
  line-height: 1.5;
  margin: 0 0 7px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.event h3 .dot {
  width: 16px;
  height: 16px;
  flex-basis: 16px;
  margin-top: 4px;
}
.meta { font-size: .82rem; color: #666; line-height: 1.65; }
.chip { display: inline-block; font-size: .75rem; border-radius: 20px; padding: 4px 8px; background: #f0eeeb; margin: 5px 3px 0 0; }
label { font-size: .8rem; font-weight: 650; display: grid; gap: 4px; margin-bottom: 9px; }
input, select, textarea { width: 100%; border: 1px solid #d8d4cf; border-radius: 8px; padding: 8px; background: white; }
textarea { min-height: 60px; }
.formrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.actions button { font-size: .8rem; padding: 7px 9px; }
a { color: #245f9e; overflow-wrap: anywhere; }
.small { font-size: .72rem; color: var(--muted); }

@media (max-width: 740px) {
  main { grid-template-columns: 1fr; }
  .day { min-height: 70px; padding: 3px; }
  .pill { font-size: .62rem; padding: 3px 2px; }
  .panel { padding: 11px; }
  .event { padding: 12px; }
  .event h3 { font-size: 1rem; }
}
</style>
</head>
<body>
<header>
  <h1>ボイメン5人 統合イベントカレンダー</h1>
  <p>でらボ × BOYS AND MEN｜公式予定をまとめてチェック</p>
</header>

<main>
<section class="panel">
  <div class="toolbar">
    <div>
      <button id="prev">‹</button>
      <button id="today">今月</button>
      <button id="next">›</button>
    </div>
    <div class="month" id="month"></div>
    <button class="primary" id="add">＋ 予定追加</button>
  </div>

  <div class="weekdays">
    <div>日</div><div>月</div><div>火</div><div>水</div>
    <div>木</div><div>金</div><div>土</div>
  </div>
  <div class="calendar" id="calendar"></div>
  <div class="legend" id="legend"></div>
  <p class="small">日付を選ぶと、その日のイベントが表示されます。</p>
</section>

<aside class="panel">
  <h2 id="dayTitle">選択日の予定</h2>
  <div id="dayEvents" class="cards"></div>
  <hr style="border:0;border-top:1px solid var(--line);margin:15px 0">

  <h2>公式データ更新</h2>
  <div id="status" class="status warn">更新情報を確認中…</div>
  <div class="actions">
    <button class="primary" id="refresh">公式データを再読込</button>
    <button id="backup">バックアップ</button>
    <button id="restore">復元</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
  <p class="muted">
    公式サイトの取得はGitHub Actions側で定期実行します。
    ここでの再読込は、公開された最新データを読み直します。
    手動予定はこのブラウザ内に保存されます。
  </p>

  <label>メンバーで絞り込み
    <select id="memberFilter">
      <option value="">全員</option>
      <option>辻本達規</option>
      <option>田村侑久</option>
      <option>本田剛文</option>
      <option>平松賢人</option>
      <option>吉原雅斗</option>
      <option>グループ全体</option>
      <option>その他</option>
    </select>
  </label>

  <label>種類で絞り込み
    <select id="typeFilter">
      <option value="">すべて</option>
      <option>イベント</option>
      <option>ライブ</option>
      <option>リリース</option>
      <option>テレビ</option>
      <option>ラジオ</option>
      <option>舞台</option>
      <option>配信</option>
      <option>特典会</option>
      <option>その他</option>
    </select>
  </label>
</aside>

<section class="panel" id="editor" style="grid-column:1/-1;display:none">
  <div class="toolbar">
    <h2 id="editorTitle">予定追加</h2>
    <button id="close">閉じる</button>
  </div>
  <form id="form">
    <input id="id" type="hidden">
    <div class="formrow">
      <label>日付<input id="date" type="date" required></label>
      <label>時刻<input id="time" type="text" placeholder="例 13:00 / 未定"></label>
    </div>
    <label>イベント名<input id="title" required maxlength="180"></label>
    <div class="formrow">
      <label>出演者
        <select id="member">
          <option>グループ全体</option>
          <option>辻本達規</option>
          <option>田村侑久</option>
          <option>本田剛文</option>
          <option>平松賢人</option>
          <option>吉原雅斗</option>
          <option>その他</option>
        </select>
      </label>
      <label>種類
        <select id="type">
          <option>イベント</option>
          <option>ライブ</option>
          <option>リリース</option>
          <option>テレビ</option>
          <option>ラジオ</option>
          <option>舞台</option>
          <option>配信</option>
          <option>特典会</option>
          <option>その他</option>
        </select>
      </label>
    </div>
    <label>会場<input id="place"></label>
    <label>出典URL<input id="url" type="url" placeholder="https://..."></label>
    <label>メモ<textarea id="notes"></textarea></label>
    <label style="display:flex;align-items:center;gap:7px">
      <input id="unconfirmed" type="checkbox" style="width:auto">未確認情報
    </label>
    <div class="actions">
      <button class="primary" type="submit">保存</button>
      <button type="button" id="cancel">キャンセル</button>
    </div>
  </form>
</section>
</main>

<script>
const COLORS = {
  '辻本達規':'#e65353',
  '田村侑久':'#3d8bc9',
  '本田剛文':'#e68cae',
  '平松賢人':'#d6a62c',
  '吉原雅斗':'#4d9b67',
  'グループ全体':'#7b6bc2',
  'その他':'#999'
};

const KEY = 'boimenCalendarManualV2';
let official = [];
let manual = readManual();
let month = new Date();
let selected = key(new Date());
let busy = false;

const $ = id => document.getElementById(id);

function key(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

function readManual() {
  try {
    return JSON.parse(localStorage.getItem(KEY) || '[]');
  } catch {
    return [];
  }
}

function saveManual() {
  localStorage.setItem(KEY, JSON.stringify(manual));
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;',
    '"':'&quot;', "'":'&#39;'
  }[c]));
}

/* 予定タイトル先頭の「10/31」「2026/10/31」などを表示時だけ除く */
function displayTitle(raw) {
  let s = String(raw || '').replace(/\s+/g, ' ').trim();

  s = s.replace(
    /^\s*(?:(?:20\d{2})[年/.\-]\s*)?\d{1,2}[月/.\-]\d{1,2}日?\s*[：:・\-―—]?\s*/,
    ''
  );

  s = s.replace(
    /^\s*\d{1,2}\/\d{1,2}\s*[（(][月火水木金土日祝][）)]\s*/,
    ''
  );

  return s.trim() || String(raw || '');
}

/* 月表示の予定タイトルは長すぎる場合だけ省略 */
function calendarTitle(event) {
  const title = displayTitle(event.title);
  return title.length > 22 ? title.slice(0, 21) + '…' : title;
}

function all() {
  return [
    ...official.filter(x => !manual.some(m => m.hidden && m.id === x.id)),
    ...manual.filter(x => !x.hidden)
  ];
}

function filtered(event) {
  return (
    (!$('memberFilter').value ||
      event.member === $('memberFilter').value) &&
    (!$('typeFilter').value ||
      event.type === $('typeFilter').value)
  );
}

function render() {
  $('month').textContent =
    month.getFullYear() + '年 ' + (month.getMonth()+1) + '月';

  const first = new Date(month.getFullYear(), month.getMonth(), 1);
  const start = new Date(first);
  start.setDate(1 - first.getDay());

  const today = key(new Date());
  let html = '';

  for (let i = 0; i < 42; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const dateKey = key(d);

    const events = all()
      .filter(x => x.date === dateKey && filtered(x))
      .sort((a,b) => (a.time || '').localeCompare(b.time || ''));

    html += `
      <button class="day
        ${d.getMonth() !== month.getMonth() ? 'outside' : ''}
        ${dateKey === today ? 'today' : ''}
        ${dateKey === selected ? 'selected' : ''}"
        data-date="${dateKey}">
        <span class="daynum">${d.getDate()}</span>
        ${events.slice(0,3).map(event => `
          <span class="pill"
            style="background:${COLORS[event.member] || '#999'}35;
            border-left:3px solid ${COLORS[event.member] || '#999'}">
            ${esc(calendarTitle(event))}
          </span>
        `).join('')}
        ${events.length > 3
          ? `<span class="small">ほか${events.length-3}件</span>`
          : ''}
      </button>`;
  }

  $('calendar').innerHTML = html;

  $('legend').innerHTML = Object.entries(COLORS).map(([name,color]) =>
    `<span><i class="dot" style="background:${color}"></i>${name}</span>`
  ).join('');

  document.querySelectorAll('[data-date]').forEach(button => {
    button.onclick = () => {
      selected = button.dataset.date;
      const d = new Date(selected + 'T12:00:00');
      if (d.getMonth() !== month.getMonth()) month = d;
      render();
    };
  });

  renderDay();
}

function renderDay() {
  const d = new Date(selected + 'T12:00:00');

  $('dayTitle').textContent =
    (d.getMonth()+1) + '月' + d.getDate() + '日の予定';

  const events = all()
    .filter(x => x.date === selected && filtered(x))
    .sort((a,b) => (a.time || '').localeCompare(b.time || ''));

  $('dayEvents').innerHTML = events.length
    ? events.map(event => `
      <article class="event">
        <h3>
          <i class="dot" style="background:${COLORS[event.member] || '#999'}"></i>
          <span>${esc(displayTitle(event.title))}</span>
        </h3>
        <div class="meta">
          ${esc(event.time || '時刻未定')} ·
          ${esc(event.member)} · ${esc(event.type)}
        </div>
        ${event.place
          ? `<div class="meta">📍 ${esc(event.place)}</div>`
          : ''}
        <span class="chip">
          ${event.origin === 'official' ? '公式取得' :
            event.source === 'dera' ? 'でらボ公式' :
            event.source === 'boys' ? 'BOYS AND MEN公式' : '手動登録'}
        </span>
        ${event.unconfirmed ? '<span class="chip">未確認</span>' : ''}
        ${event.notes ? `<p class="muted">${esc(event.notes)}</p>` : ''}
        ${event.url
          ? `<p><a href="${esc(event.url)}" target="_blank" rel="noopener">公式・出典ページ ↗</a></p>`
          : ''}
        <div class="actions">
          <button data-edit="${esc(event.id)}">編集</button>
          <button class="danger" data-del="${esc(event.id)}">削除</button>
        </div>
      </article>
    `).join('')
    : '<p class="muted">この日の予定はまだありません。公式データを再読込するか、手動で追加してね。</p>';

  document.querySelectorAll('[data-edit]').forEach(button => {
    button.onclick = () => {
      const event = all().find(x => x.id === button.dataset.edit);
      if (event) edit(event);
    };
  });

  document.querySelectorAll('[data-del]').forEach(button => {
    button.onclick = () => {
      const event = all().find(x => x.id === button.dataset.del);
      if (!event) return;
      if (!confirm('「' + event.title + '」を削除する？')) return;

      if (event.origin === 'official') {
        manual.push({...event, hidden:true});
      } else {
        manual = manual.filter(x => x.id !== event.id);
      }

      saveManual();
      render();
    };
  });
}

async function refresh() {
  if (busy) return;
  busy = true;
  $('refresh').disabled = true;
  $('status').className = 'status warn';
  $('status').textContent = '最新の公式データを読み込み中…';

  try {
    const response = await fetch('./data/events.json?ts=' + Date.now(), {
      cache: 'no-store'
    });

    if (!response.ok) throw Error('HTTP ' + response.status);

    const data = await response.json();
    official = data.events || [];

    $('status').className = 'status ok';
    $('status').innerHTML =
      `公式データを読み込みました。<br>
      取得イベント：${official.length}件<br>
      最終取得：${esc(data.updated_at || '不明')}<br>
      情報源ごとの結果：
      ${Object.entries(data.sources || {}).map(([name,source]) =>
        esc(name) + ' ' + (source.count ?? 0) + '件'
      ).join(' / ')}`;

    render();
  } catch (error) {
    $('status').className = 'status warn';
    $('status').textContent =
      '公開データを取得できませんでした（' + error.message +
      '）。GitHub Actionsとdata/events.jsonを確認してね。';
  } finally {
    busy = false;
    $('refresh').disabled = false;
  }
}

function edit(event) {
  $('editor').style.display = 'block';
  $('editorTitle').textContent = event ? '予定を編集' : '予定を追加';
  $('id').value = event ? event.id : '';
  $('date').value = event ? event.date : selected;
  $('time').value = event ? event.time || '' : '';
  $('title').value = event ? event.title : '';
  $('member').value = event ? event.member : 'グループ全体';
  $('type').value = event ? event.type : 'イベント';
  $('place').value = event ? event.place || '' : '';
  $('url').value = event ? event.url || '' : '';
  $('notes').value = event ? event.notes || '' : '';
  $('unconfirmed').checked = !!(event && event.unconfirmed);
  $('editor').scrollIntoView({behavior:'smooth'});
}

function closeEditor() {
  $('editor').style.display = 'none';
  $('form').reset();
}

$('form').onsubmit = event => {
  event.preventDefault();

  const id = $('id').value || 'manual-' + Date.now();

  const item = {
    id,
    date: $('date').value,
    time: $('time').value.trim(),
    title: $('title').value.trim(),
    member: $('member').value,
    type: $('type').value,
    place: $('place').value.trim(),
    url: $('url').value.trim(),
    notes: $('notes').value.trim(),
    unconfirmed: $('unconfirmed').checked,
    source: 'manual'
  };

  if (!item.date || !item.title) return;

  manual = manual.filter(x => x.id !== id);
  manual.push(item);
  saveManual();

  selected = item.date;
  month = new Date(item.date + 'T12:00:00');

  closeEditor();
  render();
};

$('prev').onclick = () => {
  month = new Date(month.getFullYear(), month.getMonth()-1, 1);
  render();
};

$('next').onclick = () => {
  month = new Date(month.getFullYear(), month.getMonth()+1, 1);
  render();
};

$('today').onclick = () => {
  month = new Date();
  selected = key(new Date());
  render();
};

$('add').onclick = () => edit(null);
$('close').onclick = closeEditor;
$('cancel').onclick = closeEditor;
$('refresh').onclick = refresh;
$('memberFilter').onchange = render;
$('typeFilter').onchange = render;

$('backup').onclick = () => {
  const blob = new Blob(
    [JSON.stringify(manual, null, 2)],
    {type:'application/json'}
  );
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'boimen-calendar-manual-backup.json';
  link.click();
  URL.revokeObjectURL(link.href);
};

$('restore').onclick = () => $('file').click();

$('file').onchange = async event => {
  try {
    const backup = JSON.parse(await event.target.files[0].text());
    if (!Array.isArray(backup)) throw Error();

    if (confirm('手動予定をバックアップの内容で置き換える？')) {
      manual = backup;
      saveManual();
      render();
    }
  } catch {
    alert('バックアップファイルを読み込めませんでした');
  }

  event.target.value = '';
};

render();
refresh();
setInterval(refresh, 30 * 60 * 1000);
</script>
</body>
</html>
