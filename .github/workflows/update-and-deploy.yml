name: Update official schedules and publish calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch official schedules
        run: |
          python scrape.py
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          urls = [
              "https://dxboys.bitfan.id/",
              "https://dxboys.bitfan.id/schedules/menu/184780",
          ]

          for url in urls:
              print("\nCHECK:", url)
              try:
                  r = requests.get(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      },
                      timeout=25,
                  )
                  print("STATUS:", r.status_code)
                  print("HTML_LENGTH:", len(r.text))
                  soup = BeautifulSoup(r.text, "html.parser")
                  links = [
                      a.get("href", "")
                      for a in soup.select("a[href]")
                      if "/schedules/" in a.get("href", "")
                  ]
                  print("SCHEDULE_LINK_COUNT:", len(links))
                  print("SAMPLE_LINKS:", links[:10])
              except Exception as e:
                  print("ERROR:", type(e).__name__, str(e))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site with fresh data
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
