name: Update official schedules and publish calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch official schedules
        run: python scrape.py

      - name: Diagnose Dera schedule page
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup

          urls = [
              "https://dxboys.bitfan.id/",
              "https://dxboys.bitfan.id/schedules/menu/184780",
          ]

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          for url in urls:
              print("\n" + "=" * 70)
              print("PAGE:", url)

              try:
                  response = requests.get(
                      url,
                      headers=headers,
                      timeout=30,
                  )
                  print("STATUS:", response.status_code)
                  print("HTML_LENGTH:", len(response.text))

                  soup = BeautifulSoup(
                      response.text,
                      "html.parser",
                  )

                  links = []
                  for a in soup.select("a[href]"):
                      href = a.get("href", "")
                      if "schedules" in href.lower():
                          links.append({
                              "title": a.get_text(" ", strip=True),
                              "href": href,
                          })

                  print("SCHEDULE_LINK_COUNT:", len(links))
                  for item in links[:30]:
                      print("LINK:", item)

                  scripts = [
                      s.get("src")
                      for s in soup.select("script[src]")
                  ]

                  print("SCRIPT_COUNT:", len(scripts))

                  for script_url in scripts:
                      if not script_url:
                          continue

                      if not any(
                          word in script_url.lower()
                          for word in (
                              "schedule",
                              "calendar",
                              "app",
                          )
                      ):
                          continue

                      full_url = requests.compat.urljoin(
                          url,
                          script_url,
                      )

                      try:
                          js_response = requests.get(
                              full_url,
                              headers=headers,
                              timeout=30,
                          )

                          print("\nSCRIPT_URL:", full_url)
                          print(
                              "SCRIPT_STATUS:",
                              js_response.status_code,
                          )
                          print(
                              "SCRIPT_LENGTH:",
                              len(js_response.text),
                          )

                          js = js_response.text

                          patterns = [
                              r"/api/",
                              r"schedules",
                              r"schedule",
                              r"axios",
                              r"fetch\s*\(",
                              r"XMLHttpRequest",
                              r"\.ajax\s*\(",
                              r"\.json",
                          ]

                          seen = set()
                          count = 0

                          for pattern in patterns:
                              for match in re.finditer(
                                  pattern,
                                  js,
                                  re.IGNORECASE,
                              ):
                                  start = max(
                                      0,
                                      match.start() - 180,
                                  )
                                  end = min(
                                      len(js),
                                      match.end() + 300,
                                  )

                                  snippet = js[start:end]

                                  if snippet in seen:
                                      continue

                                  seen.add(snippet)
                                  print(
                                      "\nJS_MATCH:",
                                      pattern,
                                  )
                                  print(snippet[:500])

                                  count += 1
                                  if count >= 25:
                                      break

                              if count >= 25:
                                  break

                          print("JS_MATCH_COUNT:", count)

                      except Exception as e:
                          print("SCRIPT_ERROR:", repr(e))

              except Exception as e:
                  print("PAGE_ERROR:", repr(e))

          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
