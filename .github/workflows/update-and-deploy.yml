name: Update official schedules and publish calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch official schedules
        run: python scrape.py

      - name: Diagnose Dera schedule page
        run: |
          python - <<'PY'
          import re
          import requests
          from urllib.parse import urljoin

          base = "https://dxboys.bitfan.id"
          page = requests.get(
              base + "/schedules/menu/184780",
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=25,
          )
          page.raise_for_status()

          from bs4 import BeautifulSoup
          soup = BeautifulSoup(page.text, "html.parser")

          scripts = [
              urljoin(base, s.get("src", ""))
              for s in soup.select("script[src]")
              if "schedule_calender" in s.get("src", "")
          ]

          print("SCHEDULE_SCRIPTS:", scripts)

          patterns = re.compile(
              r"schedules|calendar|calender|api/|graphql|"
              r"axios|fetch\(|\.json|pagination|per_page|page_size",
              re.I,
          )

          for url in scripts:
              print("\n===== SCRIPT:", url, "=====")
              try:
                  r = requests.get(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"},
                      timeout=25,
                  )
                  print("STATUS:", r.status_code)
                  print("LENGTH:", len(r.text))

                  matches = list(patterns.finditer(r.text))
                  print("MATCH_COUNT:", len(matches))

                  shown = set()
                  for match in matches:
                      start = max(0, match.start() - 100)
                      end = min(len(r.text), match.end() + 180)
                      snippet = r.text[start:end].replace("\n", " ")

                      if snippet in shown:
                          continue
                      shown.add(snippet)
                      print("MATCH:", snippet[:300])

                      if len(shown) >= 30:
                          break

              except Exception as e:
                  print("ERROR:", type(e).__name__, str(e))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site with fresh data
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
