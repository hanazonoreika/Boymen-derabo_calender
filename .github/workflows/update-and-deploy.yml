name: Update official schedules and publish calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch official schedules
        run: python scrape.py

      - name: Diagnose Dera calendar API
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          page_url = "https://dxboys.bitfan.id/schedules/menu/184780"
          headers = {"User-Agent": "Mozilla/5.0"}

          response = requests.get(
              page_url,
              headers=headers,
              timeout=30,
          )
          print("PAGE_STATUS:", response.status_code)

          soup = BeautifulSoup(response.text, "html.parser")
          calendar = soup.select_one("#js-schedule-calender")

          if calendar:
              print("CALENDAR_SUBDOMAIN:", calendar.get("data-subdomain"))
          else:
              print("CALENDAR_ELEMENT_NOT_FOUND")

          jwt_meta = soup.select_one('meta[name="jwt-token"]')
          print("JWT_META_FOUND:", jwt_meta is not None)

          scripts = [
              item.get("src")
              for item in soup.select("script[src]")
              if item.get("src")
          ]

          found = False

          for script in scripts:
              if "schedule_calender-" not in script:
                  continue

              if "runtime~app" in script:
                  continue

              script_url = urljoin(page_url, script)
              print("\nSCRIPT_URL:", script_url)

              js_response = requests.get(
                  script_url,
                  headers=headers,
                  timeout=30,
              )
              print("SCRIPT_STATUS:", js_response.status_code)
              print("SCRIPT_LENGTH:", len(js_response.text))

              js = js_response.text

              patterns = [
                  r'baseURL',
                  r'/fanclubs/',
                  r'jwt-token',
                  r'withCredentials',
                  r'Authorization',
              ]

              for pattern in patterns:
                  matches = list(
                      re.finditer(pattern, js, re.IGNORECASE)
                  )
                  print("\nPATTERN:", pattern, "COUNT:", len(matches))

                  for match in matches[:4]:
                      start = max(0, match.start() - 350)
                      end = min(len(js), match.end() + 500)
                      print(js[start:end])
                      print("---")

              found = True

          if not found:
              print("MAIN_CALENDAR_SCRIPT_NOT_FOUND")

          print("\nDIAGNOSTIC_FINISHED")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
